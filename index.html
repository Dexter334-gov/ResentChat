<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResentChat - Real-Time Social Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- FIREBASE CONFIGURATION (PLUGGED IN WITH YOUR KEYS) -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB-hYfyMbHLoXqNPkyXsgJszQ457n3zyMk",
            authDomain: "resentchat.firebaseapp.com",
            databaseURL: "https://resentchat-default-rtdb.firebaseio.com",
            projectId: "resentchat",
            storageBucket: "resentchat.firebasestorage.app",
            messagingSenderId: "632470019323",
            appId: "1:632470019323:web:ec9821fedd13c2af51a45e",
            measurementId: "G-6BZEQTQSEK"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
    </script>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950 p-4">
        <div class="glass p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-400 to-purple-500 bg-clip-text text-transparent">ResentChat</h1>
                <p class="text-gray-400 text-sm mt-1">Connect, chat, and customize your experience</p>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-gray-800 mb-6">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 pb-3 font-semibold text-indigo-400 border-b-2 border-indigo-500">Login</button>
                <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 pb-3 font-semibold text-gray-400">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 transition py-3 rounded-lg font-semibold text-sm shadow-lg shadow-indigo-600/30">Log In</button>
            </form>

            <!-- Signup Form -->
            <form id="form-signup" onsubmit="handleSignup(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Username</label>
                    <input type="text" id="signup-username" required class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Email</label>
                    <input type="email" id="signup-email" required class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Password</label>
                    <input type="password" id="signup-password" required class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Avatar Image URL</label>
                    <input type="url" id="signup-avatar" placeholder="https://example.com/avatar.png" class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <!-- Admin Checkbox -->
                <div class="flex items-start space-x-3 pt-2">
                    <input type="checkbox" id="signup-admin-check" onchange="toggleAdminPassword()" class="mt-1 h-4 w-4 rounded border-gray-800 bg-gray-900 text-indigo-600 focus:ring-indigo-500">
                    <div>
                        <label for="signup-admin-check" class="text-sm font-medium text-gray-200 cursor-pointer">Check if developer/admin</label>
                        <p class="text-xs text-gray-500">Will ask for password</p>
                    </div>
                </div>
                <div id="admin-password-container" class="hidden">
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Admin Password</label>
                    <input type="password" id="signup-admin-pass" placeholder="Enter admin password" class="w-full bg-gray-900 border border-red-500/50 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-red-500">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 transition py-3 rounded-lg font-semibold text-sm shadow-lg">Create Account</button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-gray-900 px-2 text-gray-500">Or</span></div>
            </div>

            <button onclick="handleGoogleLogin()" class="w-full bg-gray-900 border border-gray-800 hover:bg-gray-800 transition py-3 rounded-lg font-semibold text-sm flex items-center justify-center space-x-2">
                <span>Continue with Google</span>
            </button>
        </div>
    </div>

    <!-- MAIN CHAT APP UI -->
    <div id="app-screen" class="hidden flex-1 flex h-full">
        <!-- Sidebar -->
        <div class="w-72 bg-gray-900 border-r border-gray-800 flex flex-col">
            <div class="p-4 border-b border-gray-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <img id="current-user-avatar" src="" class="w-10 h-10 rounded-full object-cover border border-indigo-500">
                    <div>
                        <h3 id="current-user-name" class="font-bold text-sm">Username</h3>
                        <span id="current-user-role" class="text-xs text-indigo-400">Member</span>
                    </div>
                </div>
                <button onclick="logout()" class="text-gray-400 hover:text-red-400 transition text-sm">Logout</button>
            </div>

            <!-- Channels & DMs Navigation -->
            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs uppercase font-bold text-gray-500 tracking-wider">Channels</span>
                        <button onclick="createCustomChannel()" class="text-gray-400 hover:text-indigo-400 text-sm">+</button>
                    </div>
                    <div id="channels-list" class="space-y-1">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

                <div>
                    <span class="text-xs uppercase font-bold text-gray-500 tracking-wider block mb-2">Friends & DMs</span>
                    <div class="flex space-x-2 mb-3">
                        <input type="text" id="add-friend-input" placeholder="Username to add" class="flex-1 bg-gray-950 border border-gray-800 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500">
                        <button onclick="sendFriendRequest()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1 rounded text-xs font-semibold">Add</button>
                    </div>
                    <div id="friends-list" class="space-y-1">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>
            
            <!-- Admin Panel Trigger (Only if Admin) -->
            <div id="admin-panel-btn-container" class="p-4 border-t border-gray-800 hidden">
                <button onclick="openAdminPanel()" class="w-full bg-red-600/20 border border-red-500/50 hover:bg-red-600/30 text-red-400 py-2 rounded-lg text-xs font-bold transition">Admin Control Panel</button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col bg-gray-950">
            <div id="chat-header" class="p-4 border-b border-gray-800 flex items-center justify-between bg-gray-900/50">
                <h2 id="active-chat-title" class="font-bold text-lg">#general</h2>
            </div>
            
            <div id="messages-container" class="flex-1 p-6 overflow-y-auto space-y-4">
                <!-- Messages load here -->
            </div>

            <form onsubmit="sendMessage(event)" class="p-4 border-t border-gray-800 bg-gray-900/50 flex space-x-2">
                <input type="text" id="message-input" placeholder="Type your message..." class="flex-1 bg-gray-900 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-lg font-semibold text-sm transition">Send</button>
            </form>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        let currentUser = null;
        let userData = null;
        let activeChat = { type: 'channel', id: 'general' };

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-signup').classList.add('hidden');
                document.getElementById('tab-login').className = "flex-1 pb-3 font-semibold text-indigo-400 border-b-2 border-indigo-500";
                document.getElementById('tab-signup').className = "flex-1 pb-3 font-semibold text-gray-400";
            } else {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-signup').classList.remove('hidden');
                document.getElementById('tab-signup').className = "flex-1 pb-3 font-semibold text-indigo-400 border-b-2 border-indigo-500";
                document.getElementById('tab-login').className = "flex-1 pb-3 font-semibold text-gray-400";
            }
        }

        function toggleAdminPassword() {
            const checked = document.getElementById('signup-admin-check').checked;
            const container = document.getElementById('admin-password-container');
            if (checked) container.classList.remove('hidden');
            else container.classList.add('hidden');
        }

        // Firebase Auth State Listener
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                db.ref('users/' + user.uid).once('value').then(snapshot => {
                    userData = snapshot.val();
                    if (!userData) {
                        userData = {
                            username: user.displayName || user.email.split('@')[0],
                            avatar: user.photoURL || "https://api.dicebear.com/7.x/identicon/svg?seed=" + user.uid,
                            role: "Member"
                        };
                        db.ref('users/' + user.uid).set(userData);
                    }
                    initAppUI();
                });
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            auth.signInWithEmailAndPassword(email, pass).catch(err => alert(err.message));
        }

        function handleSignup(e) {
            e.preventDefault();
            const username = document.getElementById('signup-username').value;
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-password').value;
            let avatar = document.getElementById('signup-avatar').value || "https://api.dicebear.com/7.x/identicon/svg?seed=" + username;
            let role = "Member";

            const isAdminChecked = document.getElementById('signup-admin-check').checked;
            if (isAdminChecked) {
                const adminPass = document.getElementById('signup-admin-pass').value;
                if (adminPass === "admin333") {
                    role = "Admin";
                } else {
                    alert("Incorrect Admin Password!");
                    return;
                }
            }

            auth.createUserWithEmailAndPassword(email, pass).then(cred => {
                const newUserData = { username, avatar, role };
                db.ref('users/' + cred.user.uid).set(newUserData);
            }).catch(err => alert(err.message));
        }

        function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(cred => {
                db.ref('users/' + cred.user.uid).once('value').then(snapshot => {
                    if (!snapshot.exists()) {
                        db.ref('users/' + cred.user.uid).set({
                            username: cred.user.displayName,
                            avatar: cred.user.photoURL,
                            role: "Member"
                        });
                    }
                });
            }).catch(err => alert(err.message));
        }

        function logout() { auth.signOut(); }

        function initAppUI() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('current-user-name').innerText = userData.username;
            document.getElementById('current-user-role').innerText = userData.role;
            document.getElementById('current-user-avatar').src = userData.avatar;

            if (userData.role === "Admin") {
                document.getElementById('admin-panel-btn-container').classList.remove('hidden');
            }

            loadChannels();
            loadFriends();
            loadMessages();
        }

        function loadChannels() {
            const list = document.getElementById('channels-list');
            db.ref('channels').on('value', snapshot => {
                list.innerHTML = '';
                const channels = snapshot.val() || { general: { name: 'general' } };
                Object.keys(channels).forEach(id => {
                    list.innerHTML += `<button onclick="switchChat('channel', '${id}')" class="w-full text-left px-3 py-2 rounded text-sm hover:bg-gray-800 transition text-gray-300"># ${channels[id].name}</button>`;
                });
            });
        }

        function createCustomChannel() {
            const name = prompt("Enter new channel name:");
            if (name) {
                const id = name.toLowerCase().replace(/\s+/g, '-');
                db.ref('channels/' + id).set({ name });
            }
        }

        function sendFriendRequest() {
            const targetName = document.getElementById('add-friend-input').value;
            alert("Friend request sent to " + targetName);
            document.getElementById('add-friend-input').value = '';
        }

        function loadFriends() {
            document.getElementById('friends-list').innerHTML = `<div class="text-xs text-gray-500 px-3 py-1">No friends added yet</div>`;
        }

        function switchChat(type, id) {
            activeChat = { type, id };
            document.getElementById('active-chat-title').innerText = (type === 'channel' ? '# ' : '@ ') + id;
            loadMessages();
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const path = activeChat.type === 'channel' ? `messages/channels/${activeChat.id}` : `messages/dms/${activeChat.id}`;
            db.ref(path).push({
                senderId: currentUser.uid,
                senderName: userData.username,
                senderAvatar: userData.avatar,
                text: text,
                timestamp: Date.now()
            });
            input.value = '';
        }

        function loadMessages() {
            const container = document.getElementById('messages-container');
            const path = activeChat.type === 'channel' ? `messages/channels/${activeChat.id}` : `messages/dms/${activeChat.id}`;
            
            db.ref(path).on('value', snapshot => {
                container.innerHTML = '';
                const msgs = snapshot.val() || {};
                Object.values(msgs).forEach(msg => {
                    container.innerHTML += `
                        <div class="flex items-start space-x-3">
                            <img src="${msg.senderAvatar}" class="w-9 h-9 rounded-full object-cover">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-sm text-indigo-300">${msg.senderName}</span>
                                    <span class="text-xs text-gray-500">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                </div>
                                <p class="text-sm text-gray-200 mt-0.5">${msg.text}</p>
                            </div>
                        </div>
                    `;
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        function openAdminPanel() {
            alert("Welcome Admin! You have full control over ResentChat.");
        }
    </script>
</body>
</html>
