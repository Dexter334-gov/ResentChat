<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResentChat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase Modular SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, push, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-hYfyMbHLoXqNPkyXsgJszQ457n3zyMk",
            authDomain: "resentchat.firebaseapp.com",
            databaseURL: "https://resentchat-default-rtdb.firebaseio.com",
            projectId: "resentchat",
            storageBucket: "resentchat.firebasestorage.app",
            messagingSenderId: "632470019323",
            appId: "1:632470019323:web:ec9821fedd13c2af51a45e",
            measurementId: "G-6BZEQTQSEK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Expose globally
        window.auth = auth;
        window.db = db;
        window.GoogleAuthProvider = GoogleAuthProvider;
        window.signInWithPopup = signInWithPopup;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signOut = signOut;
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;
        window.push = push;
        window.get = get;
        window.child = child;

        onAuthStateChanged(auth, user => {
            if (user) {
                window.currentUser = user;
                window.initAppUser(user);
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950 p-4">
        <div class="bg-gray-900 p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-400 to-purple-500 bg-clip-text text-transparent">ResentChat</h1>
                <p class="text-gray-400 text-sm mt-1">Chat & hang out with friends</p>
            </div>

            <div class="flex border-b border-gray-800 mb-6">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 pb-3 font-semibold text-indigo-400 border-b-2 border-indigo-500">Login</button>
                <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 pb-3 font-semibold text-gray-400">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 transition py-3 rounded-lg font-semibold text-sm shadow-lg shadow-indigo-600/30">Log In</button>
            </form>

            <!-- Signup Form -->
            <form id="form-signup" onsubmit="handleSignup(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Username</label>
                    <input type="text" id="signup-username" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Email</label>
                    <input type="email" id="signup-email" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Password</label>
                    <input type="password" id="signup-password" required class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Avatar Image URL (Optional)</label>
                    <input type="url" id="signup-avatar" placeholder="https://example.com/avatar.png" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 transition py-3 rounded-lg font-semibold text-sm shadow-lg">Create Account</button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-gray-900 px-2 text-gray-500">Or</span></div>
            </div>

            <button onclick="handleGoogleLogin()" class="w-full bg-gray-950 border border-gray-800 hover:bg-gray-800 transition py-3 rounded-lg font-semibold text-sm flex items-center justify-center space-x-2">
                <i class="fab fa-google text-red-400"></i>
                <span>Continue with Google</span>
            </button>
        </div>
    </div>

    <!-- MAIN DISCORD-STYLE CHAT INTERFACE -->
    <div id="app-screen" class="hidden flex-1 flex h-full overflow-hidden">
        
        <!-- LEFT SIDEBAR: Group Chats & Direct Messages -->
        <div class="w-64 bg-gray-900 border-r border-gray-800/80 flex flex-col flex-shrink-0">
            <!-- App Header -->
            <div class="p-4 border-b border-gray-800 flex items-center justify-between shadow-sm">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-[#5865F2] fa-comments text-indigo-400 text-xl"></i>
                    <h1 class="font-bold text-base text-gray-100 tracking-wide">ResentChat</h1>
                </div>
            </div>

            <!-- Scrollable Navigation -->
            <div class="flex-1 overflow-y-auto p-3 space-y-6">
                <!-- Group Chats Section -->
                <div>
                    <div class="flex items-center justify-between px-2 mb-2">
                        <span class="text-xs uppercase font-bold text-gray-400 tracking-wider">Group Chats</span>
                        <button onclick="createGroupChat()" title="Create Group Chat" class="text-gray-400 hover:text-white transition text-xs">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <div id="groups-list" class="space-y-1">
                        <!-- Group channels populated here -->
                    </div>
                </div>

                <!-- Direct Messages Section -->
                <div>
                    <div class="flex items-center justify-between px-2 mb-2">
                        <span class="text-xs uppercase font-bold text-gray-400 tracking-wider">Direct Messages</span>
                        <button onclick="openDMModal()" title="Start Direct Message" class="text-gray-400 hover:text-white transition text-xs">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <div id="dms-list" class="space-y-1">
                        <!-- DMs populated here -->
                    </div>
                </div>
            </div>

            <!-- Bottom User Profile Footer -->
            <div class="p-3 bg-gray-950/70 border-t border-gray-800 flex items-center justify-between">
                <div class="flex items-center space-x-3 overflow-hidden cursor-pointer" onclick="openAvatarModal()">
                    <div class="relative flex-shrink-0">
                        <img id="my-avatar" src="" class="w-9 h-9 rounded-full object-cover border border-gray-700">
                        <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 rounded-full ring-2 ring-gray-900"></div>
                    </div>
                    <div class="truncate">
                        <h4 id="my-username" class="font-bold text-xs text-gray-200 truncate">User</h4>
                        <p class="text-[10px] text-indigo-400">Online</p>
                    </div>
                </div>
                <div class="flex items-center space-x-1 text-gray-400">
                    <button onclick="openAvatarModal()" title="Edit Avatar" class="p-1.5 hover:text-white hover:bg-gray-800 rounded transition"><i class="fas fa-user-gear text-xs"></i></button>
                    <button onclick="logout()" title="Logout" class="p-1.5 hover:text-red-400 hover:bg-gray-800 rounded transition"><i class="fas fa-right-from-bracket text-xs"></i></button>
                </div>
            </div>
        </div>

        <!-- CENTER CHAT AREA -->
        <div class="flex-1 flex flex-col bg-gray-950 min-w-0">
            <!-- Active Chat Header -->
            <div class="h-14 border-b border-gray-800 px-6 flex items-center justify-between bg-gray-900/40">
                <div class="flex items-center space-x-3">
                    <span id="active-chat-icon" class="text-gray-400 text-lg"><i class="fas fa-hashtag"></i></span>
                    <h2 id="active-chat-title" class="font-bold text-gray-100 text-base truncate">General</h2>
                </div>
            </div>

            <!-- Messages Stream -->
            <div id="messages-container" class="flex-1 p-6 overflow-y-auto space-y-4">
                <!-- Live messages populated here -->
            </div>

            <!-- Message Input Area -->
            <div class="p-4 bg-gray-950 border-t border-gray-800/80">
                <form onsubmit="sendMessage(event)" class="bg-gray-900 rounded-xl border border-gray-800 flex items-center px-4 py-2 focus-within:border-indigo-500 transition">
                    <input type="text" id="message-input" autocomplete="off" placeholder="Message #general" class="flex-1 bg-transparent border-none text-sm text-gray-100 placeholder-gray-500 focus:outline-none">
                    <button type="submit" class="ml-2 bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-lg text-xs font-semibold transition flex items-center justify-center">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- FAR-RIGHT SIDEBAR: User Page & Online Members -->
        <div class="w-60 bg-gray-900 border-l border-gray-800/80 p-4 flex flex-col flex-shrink-0">
            <h3 class="text-xs uppercase font-bold text-gray-400 tracking-wider mb-4 px-1">Members — <span id="member-count">0</span></h3>
            
            <div id="members-list" class="flex-1 overflow-y-auto space-y-2">
                <!-- User list with + / Checkmark Add Friend icons -->
            </div>
        </div>

    </div>

    <!-- AVATAR CUSTOMIZATION MODAL -->
    <div id="avatar-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 hidden p-4">
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-bold text-gray-100 mb-2">Edit Avatar</h3>
            <p class="text-xs text-gray-400 mb-4">Paste any image URL to change your profile picture.</p>
            <input type="url" id="new-avatar-url" placeholder="https://example.com/photo.png" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-indigo-500 mb-4">
            <div class="flex justify-end space-x-2">
                <button onclick="closeAvatarModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-gray-400 hover:bg-gray-800">Cancel</button>
                <button onclick="saveAvatar()" class="px-4 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white">Save Avatar</button>
            </div>
        </div>
    </div>

    <!-- START DM MODAL -->
    <div id="dm-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 hidden p-4">
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-lg font-bold text-gray-100">Start Direct Message</h3>
                <button onclick="closeDMModal()" class="text-gray-400 hover:text-white text-xs"><i class="fas fa-times"></i></button>
            </div>
            <p class="text-xs text-gray-400 mb-4">Enter user's exact username or email address.</p>
            <input type="text" id="dm-user-input" placeholder="Username or Email" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-indigo-500 mb-4">
            <button onclick="startDMFromInput()" class="w-full py-2.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white">Open Direct Message</button>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        let userData = null;
        let activeChat = { type: 'group', id: 'general', name: 'General' };
        let allUsersCache = {};
        let friendsList = [];

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-signup').classList.add('hidden');
                document.getElementById('tab-login').className = "flex-1 pb-3 font-semibold text-indigo-400 border-b-2 border-indigo-500";
                document.getElementById('tab-signup').className = "flex-1 pb-3 font-semibold text-gray-400";
            } else {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-signup').classList.remove('hidden');
                document.getElementById('tab-signup').className = "flex-1 pb-3 font-semibold text-indigo-400 border-b-2 border-indigo-500";
                document.getElementById('tab-login').className = "flex-1 pb-3 font-semibold text-gray-400";
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            window.signInWithEmailAndPassword(window.auth, email, pass).catch(err => alert(err.message));
        }

        function handleSignup(e) {
            e.preventDefault();
            const username = document.getElementById('signup-username').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const pass = document.getElementById('signup-password').value.trim();
            let avatar = document.getElementById('signup-avatar').value.trim() || `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(username)}`;

            window.createUserWithEmailAndPassword(window.auth, email, pass).then(cred => {
                window.set(window.ref(window.db, 'users/' + cred.user.uid), {
                    username: username,
                    email: email,
                    avatar: avatar,
                    uid: cred.user.uid
                });
            }).catch(err => alert(err.message));
        }

        function handleGoogleLogin() {
            const provider = new window.GoogleAuthProvider();
            window.signInWithPopup(window.auth, provider).then(cred => {
                const userRef = window.ref(window.db, 'users/' + cred.user.uid);
                window.get(userRef).then(snapshot => {
                    if (!snapshot.exists()) {
                        window.set(userRef, {
                            username: cred.user.displayName || cred.user.email.split('@')[0],
                            email: cred.user.email,
                            avatar: cred.user.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${cred.user.uid}`,
                            uid: cred.user.uid
                        });
                    }
                });
            }).catch(err => alert(err.message));
        }

        function logout() { window.signOut(window.auth); }

        window.initAppUser = function(user) {
            const userRef = window.ref(window.db, 'users/' + user.uid);
            window.onValue(userRef, snapshot => {
                userData = snapshot.val();
                if (!userData) {
                    userData = {
                        username: user.displayName || user.email.split('@')[0],
                        email: user.email,
                        avatar: user.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${user.uid}`,
                        uid: user.uid
                    };
                    window.set(userRef, userData);
                }

                document.getElementById('my-username').innerText = userData.username;
                document.getElementById('my-avatar').src = userData.avatar;
                
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');

                listenToFriends();
                listenToGroups();
                listenToAllMembers();
                loadMessages();
            });
        };

        // FRIENDS LIST & ADD FRIEND
        function listenToFriends() {
            window.onValue(window.ref(window.db, `friends/${window.currentUser.uid}`), snapshot => {
                const data = snapshot.val() || {};
                friendsList = Object.keys(data);
                renderDMsList();
                renderMembersList();
            });
        }

        function toggleAddFriend(targetUid, e) {
            if (e) e.stopPropagation();
            if (!targetUid || targetUid === window.currentUser.uid) return;

            const friendRef = window.ref(window.db, `friends/${window.currentUser.uid}/${targetUid}`);
            if (friendsList.includes(targetUid)) {
                window.set(friendRef, null); // Remove friend
            } else {
                window.set(friendRef, true); // Add friend
            }
        }

        // GROUPS & DMS LISTENERS
        function listenToGroups() {
            window.onValue(window.ref(window.db, 'groups'), snapshot => {
                const groupsList = document.getElementById('groups-list');
                groupsList.innerHTML = '';
                const groups = snapshot.val() || { general: { name: 'General' } };
                
                Object.keys(groups).forEach(id => {
                    const isActive = activeChat.type === 'group' && activeChat.id === id;
                    const btnClass = isActive ? 'bg-indigo-600/20 text-indigo-400 font-semibold' : 'text-gray-400 hover:bg-gray-800/60 hover:text-gray-200';
                    groupsList.innerHTML += `
                        <button onclick="switchChat('group', '${id}', '${groups[id].name}')" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-lg text-xs transition ${btnClass}">
                            <i class="fas fa-hashtag text-gray-500"></i>
                            <span class="truncate">${groups[id].name}</span>
                        </button>
                    `;
                });
            });
        }

        function createGroupChat() {
            const name = prompt("Enter Group Chat Name:");
            if (name && name.trim()) {
                const id = name.toLowerCase().trim().replace(/\s+/g, '-');
                window.set(window.ref(window.db, 'groups/' + id), { name: name.trim() });
            }
        }

        function listenToAllMembers() {
            window.onValue(window.ref(window.db, 'users'), snapshot => {
                allUsersCache = snapshot.val() || {};
                renderMembersList();
                renderDMsList();
            });
        }

        function renderMembersList() {
            const membersList = document.getElementById('members-list');
            membersList.innerHTML = '';
            
            const usersArray = Object.values(allUsersCache);
            document.getElementById('member-count').innerText = usersArray.length;

            usersArray.forEach(u => {
                const isMe = u.uid === window.currentUser.uid;
                const isFriend = friendsList.includes(u.uid);

                let friendButtonHTML = '';
                if (!isMe) {
                    if (isFriend) {
                        friendButtonHTML = `
                            <button onclick="toggleAddFriend('${u.uid}', event)" title="Added as Friend" class="text-green-400 hover:text-red-400 p-1 text-sm transition">
                                <i class="fas fa-user-check"></i>
                            </button>
                        `;
                    } else {
                        friendButtonHTML = `
                            <button onclick="toggleAddFriend('${u.uid}', event)" title="Add Friend" class="text-gray-400 hover:text-indigo-400 p-1 text-sm transition">
                                <i class="fas fa-plus"></i>
                            </button>
                        `;
                    }
                }

                membersList.innerHTML += `
                    <div class="flex items-center justify-between p-2 rounded-lg hover:bg-gray-800/40 cursor-pointer transition" onclick="startDMWithUser('${u.uid}')">
                        <div class="flex items-center space-x-2.5 overflow-hidden">
                            <img src="${u.avatar || 'https://api.dicebear.com/7.x/identicon/svg?seed=' + u.uid}" class="w-8 h-8 rounded-full object-cover border border-gray-800 flex-shrink-0">
                            <div class="truncate">
                                <span class="font-medium text-xs ${isMe ? 'text-indigo-400 font-bold' : 'text-gray-300'} truncate">${u.username}</span>
                            </div>
                        </div>
                        ${friendButtonHTML}
                    </div>
                `;
            });
        }

        function renderDMsList() {
            const dmsListContainer = document.getElementById('dms-list');
            dmsListContainer.innerHTML = '';

            if (friendsList.length === 0) {
                dmsListContainer.innerHTML = `<p class="text-[11px] text-gray-500 px-2 py-1">No friends added yet. Click + next to a user on the right!</p>`;
                return;
            }

            friendsList.forEach(friendUid => {
                const friendObj = allUsersCache[friendUid];
                if (!friendObj) return;

                const dmRoomId = getDMRoomId(window.currentUser.uid, friendUid);
                const isActive = activeChat.type === 'dm' && activeChat.id === dmRoomId;
                const btnClass = isActive ? 'bg-indigo-600/20 text-indigo-400 font-semibold' : 'text-gray-400 hover:bg-gray-800/60 hover:text-gray-200';

                dmsListContainer.innerHTML += `
                    <button onclick="switchChat('dm', '${dmRoomId}', '${friendObj.username}')" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-lg text-xs transition ${btnClass}">
                        <img src="${friendObj.avatar}" class="w-5 h-5 rounded-full object-cover border border-gray-700">
                        <span class="truncate">${friendObj.username}</span>
                    </button>
                `;
            });
        }

        function getDMRoomId(uid1, uid2) {
            return [uid1, uid2].sort().join('_');
        }

        function startDMWithUser(targetUid) {
            if (targetUid === window.currentUser.uid) return;
            const targetUser = allUsersCache[targetUid];
            if (!targetUser) return;
            
            const dmRoomId = getDMRoomId(window.currentUser.uid, targetUid);
            switchChat('dm', dmRoomId, targetUser.username);
        }

        function switchChat(type, id, name) {
            activeChat = { type, id, name };
            document.getElementById('active-chat-title').innerText = name;
            document.getElementById('active-chat-icon').innerHTML = type === 'group' ? '<i class="fas fa-hashtag"></i>' : '<i class="fas fa-at"></i>';
            document.getElementById('message-input').placeholder = `Message ${type === 'group' ? '#' : '@'}${name}`;
            
            if (type === 'dm') renderDMsList();
            else listenToGroups();
            
            loadMessages();
        }

        // MESSAGES CONTROLLER
        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const path = activeChat.type === 'group' ? `messages/groups/${activeChat.id}` : `messages/dms/${activeChat.id}`;
            window.push(window.ref(window.db, path), {
                senderId: window.currentUser.uid,
                senderName: userData.username,
                senderAvatar: userData.avatar,
                text: text,
                timestamp: Date.now()
            });
            input.value = '';
        }

        function loadMessages() {
            const container = document.getElementById('messages-container');
            const path = activeChat.type === 'group' ? `messages/groups/${activeChat.id}` : `messages/dms/${activeChat.id}`;
            
            window.onValue(window.ref(window.db, path), snapshot => {
                container.innerHTML = '';
                const msgs = snapshot.val() || {};
                const msgList = Object.values(msgs);

                if (msgList.length === 0) {
                    container.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-gray-500">
                            <i class="fas fa-comments text-3xl mb-2 text-gray-600"></i>
                            <p class="text-xs">No messages yet. Send a message to start chatting!</p>
                        </div>
                    `;
                    return;
                }

                msgList.forEach(msg => {
                    const isMe = msg.senderId === window.currentUser.uid;
                    container.innerHTML += `
                        <div class="flex items-start space-x-3">
                            <img src="${msg.senderAvatar || 'https://api.dicebear.com/7.x/identicon/svg?seed=' + msg.senderId}" class="w-9 h-9 rounded-full object-cover border border-gray-800 flex-shrink-0">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-xs ${isMe ? 'text-indigo-400' : 'text-gray-200'}">${msg.senderName}</span>
                                    <span class="text-[10px] text-gray-500">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                </div>
                                <p class="text-xs text-gray-300 mt-1 leading-relaxed bg-gray-900/60 px-3 py-2 rounded-lg border border-gray-800/50 inline-block">${msg.text}</p>
                            </div>
                        </div>
                    `;
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        // MODALS & AVATAR EDITING
        function openAvatarModal() {
            document.getElementById('new-avatar-url').value = userData.avatar || '';
            document.getElementById('avatar-modal').classList.remove('hidden');
        }
        function closeAvatarModal() { document.getElementById('avatar-modal').classList.add('hidden'); }

        function saveAvatar() {
            const newUrl = document.getElementById('new-avatar-url').value.trim();
            if (!newUrl) return;

            window.set(window.ref(window.db, `users/${window.currentUser.uid}/avatar`), newUrl).then(() => {
                closeAvatarModal();
            });
        }

        function openDMModal() { document.getElementById('dm-modal').classList.remove('hidden'); }
        function closeDMModal() { document.getElementById('dm-modal').classList.add('hidden'); }

        function startDMFromInput() {
            const query = document.getElementById('dm-user-input').value.trim().toLowerCase();
            if (!query) return;

            const matchedUser = Object.values(allUsersCache).find(u => 
                (u.username && u.username.toLowerCase() === query) || 
                (u.email && u.email.toLowerCase() === query)
            );

            if (matchedUser) {
                toggleAddFriend(matchedUser.uid);
                startDMWithUser(matchedUser.uid);
                closeDMModal();
                document.getElementById('dm-user-input').value = '';
            } else {
                alert("User not found! Make sure they have registered an account.");
            }
        }
    </script>
</body>
</html>
